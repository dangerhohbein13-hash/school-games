<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Court Pong</title>
  <link rel="stylesheet" href="/games/game-shell.css" />
</head>
<body>
  <div class="game-shell">
    <header class="hud">
      <div class="hud-title">Court Pong</div>
      <div class="hud-stats">
        <span class="hud-stat">You<strong id="pScore">0</strong></span>
        <span class="hud-stat">CPU<strong id="cpuScore">0</strong></span>
        <span class="hud-stat">First to<strong>7</strong></span>
      </div>
      <div class="hud-actions">
        <button class="btn" id="pauseBtn" type="button">Pause</button>
        <button class="btn" id="muteBtn" type="button">Sound: On</button>
      </div>
    </header>

    <main class="stage">
      <canvas id="canvas" width="640" height="400"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <h2 id="overlayTitle">Court Pong</h2>
          <div class="overlay-score hidden" id="overlayScore">0 - 0</div>
          <p id="overlayText">Control the left paddle with W / S, Arrow keys, or your mouse pointer. First to 7 wins.</p>
          <div class="overlay-actions">
            <button class="btn btn-primary" id="startBtn" type="button">Start Match</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/games/game-audio.js"></script>
  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const pScoreEl = document.getElementById('pScore');
      const cpuScoreEl = document.getElementById('cpuScore');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayScore = document.getElementById('overlayScore');
      const overlayText = document.getElementById('overlayText');
      const startBtn = document.getElementById('startBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const muteBtn = document.getElementById('muteBtn');

      GameAudio.syncButton(muteBtn);

      let state = 'TITLE_MENU';
      let rafId = null;
      let pScore = 0;
      let cpuScore = 0;
      const keys = {};

      const player = { x: 24, y: 158, w: 12, h: 84, speed: 6.5 };
      const cpu = { x: canvas.width - 36, y: 158, w: 12, h: 84, speed: 4.9 };
      const ball = { x: 320, y: 200, r: 8, vx: 5, vy: 2 };

      function serve(toPlayer) {
        ball.x = canvas.width / 2;
        ball.y = canvas.height / 2;
        const speed = 5.4;
        const angle = (Math.random() * 0.7 - 0.35);
        ball.vx = (toPlayer ? -1 : 1) * Math.cos(angle) * speed;
        ball.vy = Math.sin(angle) * speed;
      }

      function startGame() {
        if (rafId) cancelAnimationFrame(rafId);
        pScore = 0;
        cpuScore = 0;
        pScoreEl.textContent = '0';
        cpuScoreEl.textContent = '0';
        player.y = 158;
        cpu.y = 158;
        serve(false);
        state = 'PLAYING';
        overlay.classList.add('hidden');
        pauseBtn.textContent = 'Pause';
        loop();
      }

      function togglePause() {
        if (state === 'PLAYING') {
          state = 'PAUSED';
          if (rafId) cancelAnimationFrame(rafId);
          pauseBtn.textContent = 'Resume';
          overlayTitle.textContent = 'Match Paused';
          overlayScore.classList.add('hidden');
          overlayText.textContent = 'Press P or click Resume to continue the rally.';
          startBtn.textContent = 'Resume';
          overlay.classList.remove('hidden');
        } else if (state === 'PAUSED') {
          state = 'PLAYING';
          pauseBtn.textContent = 'Pause';
          overlay.classList.add('hidden');
          loop();
        }
      }

      function update() {
        if (keys['w'] || keys['arrowup']) player.y -= player.speed;
        if (keys['s'] || keys['arrowdown']) player.y += player.speed;
        player.y = Math.max(8, Math.min(canvas.height - player.h - 8, player.y));

        const targetY = ball.vx > 0 ? ball.y - cpu.h / 2 : canvas.height / 2 - cpu.h / 2;
        if (cpu.y + 4 < targetY) cpu.y += cpu.speed;
        else if (cpu.y - 4 > targetY) cpu.y -= cpu.speed;
        cpu.y = Math.max(8, Math.min(canvas.height - cpu.h - 8, cpu.y));

        ball.x += ball.vx;
        ball.y += ball.vy;

        if (ball.y - ball.r < 0) {
          ball.y = ball.r;
          ball.vy = Math.abs(ball.vy);
          GameAudio.hit();
        } else if (ball.y + ball.r > canvas.height) {
          ball.y = canvas.height - ball.r;
          ball.vy = -Math.abs(ball.vy);
          GameAudio.hit();
        }

        // Player paddle
        if (
          ball.vx < 0 &&
          ball.x - ball.r <= player.x + player.w &&
          ball.x + ball.r >= player.x &&
          ball.y >= player.y - 4 &&
          ball.y <= player.y + player.h + 4
        ) {
          const rel = (ball.y - (player.y + player.h / 2)) / (player.h / 2);
          const speed = Math.min(10.5, Math.hypot(ball.vx, ball.vy) * 1.045);
          const angle = rel * (Math.PI / 3.4);
          ball.vx = Math.cos(angle) * speed;
          ball.vy = Math.sin(angle) * speed;
          ball.x = player.x + player.w + ball.r + 1;
          GameAudio.blip();
        }

        // CPU paddle
        if (
          ball.vx > 0 &&
          ball.x + ball.r >= cpu.x &&
          ball.x - ball.r <= cpu.x + cpu.w &&
          ball.y >= cpu.y - 4 &&
          ball.y <= cpu.y + cpu.h + 4
        ) {
          const rel = (ball.y - (cpu.y + cpu.h / 2)) / (cpu.h / 2);
          const speed = Math.min(10.5, Math.hypot(ball.vx, ball.vy) * 1.045);
          const angle = rel * (Math.PI / 3.4);
          ball.vx = -Math.cos(angle) * speed;
          ball.vy = Math.sin(angle) * speed;
          ball.x = cpu.x - ball.r - 1;
          GameAudio.blip();
        }

        if (ball.x < -12) {
          cpuScore++;
          cpuScoreEl.textContent = String(cpuScore);
          GameAudio.over();
          if (cpuScore >= 7) endMatch(false);
          else serve(true);
        } else if (ball.x > canvas.width + 12) {
          pScore++;
          pScoreEl.textContent = String(pScore);
          GameAudio.score();
          if (pScore >= 7) endMatch(true);
          else serve(false);
        }
      }

      function endMatch(won) {
        state = 'GAME_OVER';
        if (won) GameAudio.win();
        overlayTitle.textContent = won ? 'You Win the Match!' : 'CPU Takes the Set';
        overlayScore.textContent = pScore + ' – ' + cpuScore;
        overlayScore.classList.remove('hidden');
        overlayText.textContent = won ? 'Sharp reflexes on the court.' : 'Want a rematch?';
        startBtn.textContent = 'Play Again';
        overlay.classList.remove('hidden');
      }

      function draw() {
        ctx.fillStyle = '#0d1518';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(255,255,255,0.14)';
        ctx.setLineDash([8, 8]);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 12);
        ctx.lineTo(canvas.width / 2, canvas.height - 12);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.roundRect(player.x, player.y, player.w, player.h, 5);
        ctx.roundRect(cpu.x, cpu.y, cpu.w, cpu.h, 5);
        ctx.fill();

        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
      }

      function loop() {
        if (state !== 'PLAYING') return;
        update();
        draw();
        if (state === 'PLAYING') rafId = requestAnimationFrame(loop);
      }

      canvas.addEventListener('pointermove', function (e) {
        if (state !== 'PLAYING') return;
        const rect = canvas.getBoundingClientRect();
        const my = (e.clientY - rect.top) * (canvas.height / rect.height);
        player.y = Math.max(8, Math.min(canvas.height - player.h - 8, my - player.h / 2));
      });

      window.addEventListener('keydown', function (e) {
        const k = e.key.toLowerCase();
        if (['arrowup', 'arrowdown', ' '].includes(k)) e.preventDefault();
        keys[k] = true;
        if (k === 'p' || k === 'escape') {
          if (state === 'PLAYING' || state === 'PAUSED') togglePause();
        }
        if ((k === ' ' || k === 'enter') && (state === 'TITLE_MENU' || state === 'GAME_OVER')) {
          startGame();
        }
      });

      window.addEventListener('keyup', function (e) {
        keys[e.key.toLowerCase()] = false;
      });

      startBtn.addEventListener('click', function () {
        if (state === 'PAUSED') togglePause();
        else startGame();
      });
      pauseBtn.addEventListener('click', togglePause);
      muteBtn.addEventListener('click', function () {
        GameAudio.toggleMute(muteBtn);
      });

      draw();
    })();
  </script>
</body>
</html>
